<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow the lizard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦎</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16301f;--bg2:#1f4630;--leaf:#a5d86a;--lime:#e9f27a;--blush:#ff9eb5;--ink:#f1f7e6;--muted:#b9cfb0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg) 60%);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
h1,h2{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.1}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#trail{position:relative;height:44px;margin:14px 22px 0;flex:none}
#trail:before{content:"";position:absolute;left:0;right:0;top:30px;border-top:3px dotted var(--leaf);opacity:.6}
#liz{position:absolute;top:2px;left:0;font-size:28px;transform:scaleX(-1);transition:left .6s ease}
#stage{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:12px 22px}
.slide{width:100%;max-width:520px;text-align:center;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pics{display:flex;gap:12px;justify-content:center;margin-bottom:18px}
.pics img{max-height:46vh;max-width:100%;min-width:0;object-fit:contain;border-radius:26px 54px 26px 54px;border:4px solid var(--leaf);box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-1.5deg)}
.pics img:nth-child(2){transform:rotate(2deg)}
.pics.two img{max-width:48%}
h2{font-size:clamp(28px,7vw,40px);color:var(--lime);margin-bottom:8px}
p{font-size:18px;line-height:1.55;margin:0 auto;max-width:34ch;color:var(--ink)}
.hero{font-size:clamp(44px,13vw,72px);font-weight:800;color:var(--lime)}
.big{font-size:70px;display:block;margin-bottom:6px}
.sub{color:var(--muted);margin-top:12px}
nav{flex:none;display:flex;gap:10px;justify-content:center;padding:10px 22px 22px}
button{font:600 17px "Baloo 2",system-ui,sans-serif;border:0;border-radius:999px;padding:12px 28px;background:var(--leaf);color:#14281a;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--leaf)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
button:active{transform:scale(.97)}
.ask{font-family:"Baloo 2",sans-serif;font-size:clamp(26px,7vw,38px);color:var(--blush);margin:18px 0 14px}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reply{margin-top:16px;min-height:3em}
.wide{max-width:760px}.collage{display:flex;flex-wrap:wrap;justify-content:center;margin:6px 0 16px}.collage img{height:clamp(84px,17vh,130px);margin:-4px;border:3px solid var(--leaf);border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);object-fit:cover}
.say{margin:18px auto 0;max-width:420px;text-align:left}.say label{display:block;font-size:16px;color:var(--muted);margin-bottom:6px}.say textarea{width:100%;min-height:110px;border-radius:18px;border:2px solid var(--leaf);background:rgba(0,0,0,.25);color:var(--ink);font:17px Nunito,sans-serif;padding:12px;resize:vertical}.say textarea:focus-visible{outline:3px solid var(--lime)}.say button{margin-top:10px}#sent{margin-top:8px;color:var(--lime)}
.fall{position:fixed;top:-40px;font-size:26px;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}#liz{transition:none}.fall{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="trail" aria-hidden="true"><span id="liz">🦎</span></div>
  <main id="stage"></main>
  <nav><button class="ghost" id="back" hidden>Back</button><button id="next">Start the trail</button></nav>
</div>

const src=f=>IMG[f.replace(".jpg","")];
const S=[
{intro:true},
{i:["friendship.jpg"],t:"It started with a card",p:"Friendship Day. You were the best friend I could ask for, and that never stopped being true for me."},
{i:["sunflowers.jpg"],t:"Two names, one sunset",p:"Sunflowers, bees, and our names on top. I still love this one."},
{i:["lizard-rose.jpg"],t:"Lizard meets monkey",p:"I turned myself into a monkey and brought you a rose. Not my best look, but my heart was in it."},
{i:["monkeys.jpg"],t:"Monkeys, always monkeys",p:"These two showed up out of nowhere on a car windshield. Pure chaos, a bit like us."},
{i:["fingers.jpg"],t:"Tiny finger people",p:"A bow for you, a smile for me, and a heart right in the middle."},
{i:["keyboard.jpg"],t:"A secret on a keyboard",p:"Pink glow, two little bows, and some very important keys."},
{i:["teddy.jpg","tiger.jpg"],t:"Teddy Day",p:"A bear hug from me, and a tiger on guard duty."},
{i:["cake1.jpg","cake2.jpg"],t:"Two cakes, one name",p:"You deserve every candle and every wish."},
{i:["note.jpg"],t:"Thank you, Lizard",p:"I wrote this with some chocolate. I meant every word."},
{i:["her.jpg","hug.jpg"],t:"How I see us",p:"Laughing, holding on, one more coffee run."},
{collage:true},
{end:true}
];
let n=0,choice="";const FORM_URL="https://formspree.io/f/mzeeddpk";
const stage=document.getElementById("stage"),next=document.getElementById("next"),back=document.getElementById("back"),liz=document.getElementById("liz"),trail=document.getElementById("trail");
const ALL=["friendship","sunflowers","lizard-rose","monkeys","fingers","keyboard","teddy","tiger","cake1","cake2","note","her","hug"];
function collage(){return '<div class="collage">'+ALL.map(f=>[f,Math.random()]).sort((a,b)=>a[1]-b[1]).map(([f])=>'<img src="'+src(f)+'" alt="" style="transform:rotate('+(Math.random()*12-6).toFixed(1)+'deg)">').join("")+'</div>'}
function pics(a){return '<div class="pics'+(a.length>1?' two':'')+'">'+a.map(f=>'<img src="'+src(f)+'" alt="">').join("")+'</div>'}
function render(){
  const s=S[n];let h="";
  if(s.intro)h='<span class="big">🦎</span><h1 class="hero">Follow the lizard</h1><p class="sub">A small trail through some of my favourite memories with you.</p>';
  else if(s.collage)h=collage()+'<h2>All of it, together</h2><p>Every one of these made me smile. Thank you for each of them.</p>';
  else if(s.end)h='<h2>Lizard, I’m sorry</h2><p>I overthink, and I hold on too tight. I know that made you feel crowded instead of cared for. That’s on me, not you.</p><p class="sub">[sorry for everything]</p><p class="ask">Will I get another chance?</p><div class="choices"><button id="yes">Yes, let’s talk</button><button class="ghost" id="time">I need more time</button></div><p class="reply" id="reply"></p><div class="say"><label for="msg">Anything you want to tell me? and it comes only to me.</label><textarea id="msg" maxlength="2000"></textarea><button id="send">Send</button><p id="sent" role="status"></p></div>';
  else h=pics(s.i)+'<h2>'+s.t+'</h2><p>'+s.p+'</p>';
  stage.innerHTML='<section class="slide'+(s.collage?' wide':'')+'">'+h+'</section>';stage.scrollTop=0;
  liz.style.left=(n/(S.length-1))*(trail.clientWidth-30)+"px";
  back.hidden=n===0;next.hidden=!!s.end;next.textContent=n===0?"Start the trail":"Next";
  if(s.end){
    document.getElementById("yes").onclick=()=>{choice="Yes, let's talk";reply("Thank you. Message me whenever you’re ready, I’ll be waiting. 💚");rain()};
    document.getElementById("time").onclick=()=>{choice="I need more time";reply("That’s okay. Take all the time you need. I won’t push. 💚")};
    document.getElementById("send").onclick=send;
  }
}
async function send(){const m=document.getElementById("msg"),o=document.getElementById("sent"),t=m.value.trim();if(!t){o.textContent="Write something first, or just skip this.";return}o.textContent="Sending…";try{const r=await fetch(FORM_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({message:t,answer:choice||"(no button chosen)"})});if(!r.ok)throw 0;m.value="";o.textContent="Sent. Thank you for telling me. 💚"}catch(e){o.textContent="That didn’t send. Please try again in a bit."}}
function reply(t){document.getElementById("reply").textContent=t}
function rain(){for(let i=0;i<14;i++){const e=document.createElement("span");e.className="fall";e.textContent=i%2?"🦎":"💚";e.style.left=Math.random()*95+"vw";e.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
function go(d){n=Math.max(0,Math.min(S.length-1,n+d));render()}
next.onclick=()=>go(1);back.onclick=()=>go(-1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let x0=null;addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(d<0?1:-1);x0=null});
addEventListener("resize",render);
render();
</script>
